[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-aerodynamic-workflow"
version = "1.0.0"
description = "OpenVSP/VSPAERO workflows for ARGUS outer-wing morphing studies"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]


